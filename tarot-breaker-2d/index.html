<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#111633">
  <title>TAROT BREAKER — 1000年前の星の国</title>
  <link rel="stylesheet" href="./game.css?v=0.1.7">
</head>
<body>
  <main id="game-shell" aria-label="TAROT BREAKER 1000年前の星の国">
    <canvas id="game" aria-label="星の国を探索するゲーム画面"></canvas>
    <section id="start-screen" class="start-screen" aria-live="polite">
      <div class="start-card">
        <div class="eyebrow">TAROT BREAKER</div>
        <h1>1000年前の星の国</h1>
        <p>星門庭園</p>
        <button id="start" type="button" disabled>起動準備中…</button>
        <small id="load-note">内蔵ゲームデータを準備しています</small>
      </div>
    </section>
    <div id="guide" class="guide" hidden>画面左側を押して、そのまま指を動かす</div>
    <div id="joystick" class="joystick" hidden aria-hidden="true">
      <div class="joystick__ring"></div>
      <div id="joystick-knob" class="joystick__knob"></div>
    </div>
    <button id="reset" class="reset" type="button" aria-label="開始地点へ戻る" hidden>↺</button>
  </main>

  <script>window.__TB_SPRITE_PARTS=[];</script>
  <script src="./data/map-data.js?v=0.1.7" defer></script>
  <script src="./data/sprite-part0.js?v=0.1.7" defer></script>
  <script src="./data/sprite-part1.js?v=0.1.7" defer></script>
  <script src="./data/sprite-part2.js?v=0.1.7" defer></script>
  <script src="./data/sprite-part3.js?v=0.1.7" defer></script>
  <script src="./data/sprite-part4.js?v=0.1.7" defer></script>
  <script src="./data/sprite-part5.js?v=0.1.7" defer></script>
  <script src="./game.js?v=0.1.7" defer></script>
</body>
</html>
