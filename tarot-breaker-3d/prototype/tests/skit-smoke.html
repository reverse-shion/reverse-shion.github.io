<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow"><link rel="icon" href="data:,">
  <title>Phase 2 スキット接続テスト（3D描画なし）</title>
  <link rel="stylesheet" href="../../../css/shiopon-skit.css?v=p2-1.1.0">
  <link rel="stylesheet" href="../css/prototype.css?v=p2-1.1.0">
</head>
<body>
  <main id="test-start" class="screen"><div class="intro compact">
    <h1 style="font-size:30px">スキット接続テスト</h1>
    <p>3D描画を含まない検証用画面です。<br>本番用の入口ではありません。</p>
    <button id="open-test" type="button" class="primary">会話テストを開始</button>
    <button id="sound-test" type="button" aria-pressed="false">音楽 OFF</button>
    <p id="test-status" role="status">終了回数：0</p>
    <p id="audio-status">音楽は停止しています</p>
  </div></main>
  <audio id="test-audio" preload="none" loop></audio>
  <div id="sv-skit" hidden><div class="sv-overlay"><div class="sv-overlay-backdrop"></div>
    <section class="sv-overlay-panel" role="dialog" aria-modal="true" aria-label="シオン・しおぽん・リュミエールの会話" tabindex="-1">
      <div class="skit-toolbar"><button id="skit-sound" type="button" aria-pressed="false">音楽 OFF</button><button id="close-skit" type="button">星界へ戻る ×</button></div>
      <div class="sv-overlay-body"><div id="skit-mount" class="sv-engine-root"></div></div>
    </section>
  </div></div>
  <script src="../../../js/skitEngine.js?v=p2-1.1.0"></script>
  <script type="module">
    import { SkitBridge } from '../js/skit-bridge.js?v=p2-1.1.0';
    import { AudioController } from '../js/audio.js?v=p2-1.1.0';
    import { asset, loadJSON } from '../js/config.js?v=p2-1.1.0';
    const $=id=>document.getElementById(id);
    const [characters,eventData]=await Promise.all([loadJSON(asset('tarot-breaker-3d/prototype/data/characters.json')),loadJSON(asset('tarot-breaker-3d/prototype/data/events.json'))]);
    let count=0;
    const audio=new AudioController(asset('audio/seifu-raguna.mp3'),(enabled,message)=>{
      for(const id of ['sound-test','skit-sound']) {$(id).textContent=enabled?'音楽 ON':'音楽 OFF';$(id).setAttribute('aria-pressed',String(enabled));}
      if(message)$('audio-status').textContent=message;
    },()=>$('test-audio'));
    audio.setScene('explore',true);
    for(const id of ['sound-test','skit-sound'])$(id).addEventListener('click',()=>audio.toggle());
    const bridge=new SkitBridge({host:$('sv-skit'),mount:$('skit-mount'),closeButton:$('close-skit'),characters,
      onClose:completed=>{count++;$('test-status').textContent=`終了回数：${count} ／ ${completed?'最後まで読了':'途中で終了'}`;$('test-start').inert=false;$('open-test').focus();audio.setScene('explore',!document.hidden);},
      onError:message=>{$('test-status').textContent=message;}});
    $('open-test').addEventListener('click',()=>{$('test-start').inert=true;audio.setScene('skit',true);void bridge.open(eventData.events[0]);});
    $('test-audio').addEventListener('timeupdate',()=>{$('audio-status').textContent=`音楽 ${$('test-audio').currentTime.toFixed(1)}秒 ／ 音量 ${$('test-audio').volume.toFixed(2)}`;});
    document.addEventListener('visibilitychange',()=>audio.setScene(bridge.session?'skit':'explore',!document.hidden));
    window.addEventListener('pagehide',()=>{bridge.dispose();audio.dispose();});
  </script>
</body>
</html>
