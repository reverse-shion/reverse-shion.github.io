<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#101526">
  <title>TAROT BREAKER 3D — 1000年前の星界</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../../css/shiopon-skit.css?v=p2-1.8.0">
  <link rel="stylesheet" href="./css/prototype.css?v=p2-1.8.0">
  <link rel="stylesheet" href="./css/mobile-controls.css?v=p2-1.8.0">
</head>
<body>
  <main id="world" aria-label="1000年前のシオンの記憶" tabindex="-1">
    <canvas id="scene" aria-label="シオンの視界で追体験する星界の回廊"></canvas>
    <div id="look" aria-label="一本指で前後に歩き、左右へ曲がる。二本指で視線を調整"></div>

    <header class="hud">
      <div>
        <span class="eyebrow">TAROT BREAKER</span>
        <p>1000年前の星界</p>
      </div>
      <div class="hud-actions">
        <button id="view-follow" type="button" aria-pressed="true">自動視点 ON</button>
        <button id="sound" type="button" aria-pressed="true">音楽 ON</button>
      </div>
    </header>

    <p id="guide" class="guide" hidden></p>
    <div class="reticle" aria-hidden="true">·</div>

    <div id="controls" hidden>
      <div id="stick" aria-hidden="true"><span id="thumb"></span><span class="stick-label">移動</span></div>
      <button id="interact" type="button" hidden>ふたりに声をかける</button>
    </div>
  </main>

  <section id="start-screen" class="screen" aria-labelledby="start-title">
    <div class="intro intro-cinematic">
      <p class="eyebrow">TAROT BREAKER</p>
      <h1 id="start-title">1000年前の星界</h1>
      <p class="lead">星の声は、まだここに残っている。</p>
      <button id="start" class="primary" type="button">星界へ</button>
      <p id="start-status" role="status" hidden></p>
      <noscript>この試作にはJavaScriptが必要です。</noscript>
    </div>
  </section>

  <section id="pause-screen" class="screen" hidden aria-labelledby="pause-title">
    <div class="intro compact">
      <p class="eyebrow">TAROT BREAKER</p>
      <h2 id="pause-title">おかえりなさい</h2>
      <p id="pause-message">星界は、ここで待っています。</p>
      <button id="resume" class="primary" type="button">記憶へ戻る</button>
    </div>
  </section>

  <div id="sv-skit" hidden>
    <div class="sv-overlay">
      <div class="sv-overlay-backdrop"></div>
      <section class="sv-overlay-panel" role="dialog" aria-modal="true" aria-label="シオン・しおぽん・リュミエールの会話" tabindex="-1">
        <div class="skit-toolbar">
          <button id="skip-memory" type="button" hidden>SKIP</button>
          <button id="skit-sound" type="button" aria-pressed="true">音楽 ON</button>
          <button id="close-skit" type="button">記憶から離れる ×</button>
        </div>
        <div class="sv-overlay-body"><div id="skit-mount" class="sv-engine-root"></div></div>
      </section>
    </div>
  </div>

  <p id="notice" class="notice" role="status" hidden></p>
  <script src="../../js/skitEngine.js?v=p2-1.8.0"></script>
  <script type="module" src="./js/boot.js?v=p2-1.8.0"></script>
</body>
</html>
